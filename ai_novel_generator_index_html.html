<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI 小說生成器</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 999px;
    }

    body {
      background: #0f0f0f;
      color: white;
      overflow: hidden;
      font-family: sans-serif;
    }

    textarea {
      resize: none;
    }
  </style>
</head>

<body>

  <div class="flex h-screen">

    <!-- 左側控制區 -->
    <div class="w-[420px] border-r border-zinc-700 p-5 overflow-y-auto bg-zinc-900">

      <h1 class="text-3xl font-bold mb-6">
        AI 小說生成器
      </h1>

      <div class="space-y-5">

        <!-- API KEY -->
        <div>
          <label class="block mb-2 text-sm text-zinc-400">
            Gemini API Key
          </label>

          <input
            id="apiKey"
            type="password"
            placeholder="AIza..."
            class="w-full bg-zinc-800 p-3 rounded-xl outline-none"
          />
        </div>

        <!-- 角色設定 -->
        <div>
          <label class="block mb-2 text-sm text-zinc-400">
            角色設定
          </label>

          <textarea
            id="character"
            rows="5"
            placeholder="輸入角色資料..."
            class="w-full bg-zinc-800 p-3 rounded-xl outline-none"
          ></textarea>
        </div>

        <!-- 世界觀 -->
        <div>
          <label class="block mb-2 text-sm text-zinc-400">
            世界觀 / 故事背景
          </label>

          <textarea
            id="world"
            rows="5"
            placeholder="輸入故事背景..."
            class="w-full bg-zinc-800 p-3 rounded-xl outline-none"
          ></textarea>
        </div>

        <!-- 文風 -->
        <div>
          <label class="block mb-2 text-sm text-zinc-400">
            文風
          </label>

          <input
            id="style"
            type="text"
            placeholder="黑暗、唯美、輕小說..."
            class="w-full bg-zinc-800 p-3 rounded-xl outline-none"
          />
        </div>

        <!-- 鋪陳滑桿 -->
        <div>
          <label class="block mb-2 text-sm text-zinc-400">
            鋪陳比例：
            <span id="buildValue">70</span>%
          </label>

          <input
            id="buildSlider"
            type="range"
            min="0"
            max="100"
            value="70"
            class="w-full"
          />
        </div>

        <!-- 高潮滑桿 -->
        <div>
          <label class="block mb-2 text-sm text-zinc-400">
            高潮比例：
            <span id="climaxValue">30</span>%
          </label>

          <input
            id="climaxSlider"
            type="range"
            min="0"
            max="100"
            value="30"
            class="w-full"
          />
        </div>

        <!-- 生成按鈕 -->
        <button
          onclick="generateStory()"
          class="w-full bg-white text-black font-bold py-3 rounded-xl hover:opacity-80 transition"
        >
          生成故事
        </button>

      </div>
    </div>

    <!-- 右側閱讀區 -->
    <div class="flex-1 overflow-y-auto p-10">

      <div class="max-w-4xl mx-auto">

        <h2 class="text-4xl font-bold mb-8">
          閱讀區
        </h2>

        <div
          id="output"
          class="leading-8 text-zinc-200 whitespace-pre-wrap"
        >
          AI生成的故事會出現在這裡...

你終於開始讓 AI 幫你寫小說了。

人類已經正式進入：
「連創作都懶得自己痛苦完成」的時代。
挺合理的。
        </div>

      </div>
    </div>

  </div>

  <script>

    const buildSlider = document.getElementById("buildSlider");
    const climaxSlider = document.getElementById("climaxSlider");

    buildSlider.addEventListener("input", () => {
      document.getElementById("buildValue").innerText = buildSlider.value;
      climaxSlider.value = 100 - buildSlider.value;
      document.getElementById("climaxValue").innerText = climaxSlider.value;
    });

    climaxSlider.addEventListener("input", () => {
      document.getElementById("climaxValue").innerText = climaxSlider.value;
      buildSlider.value = 100 - climaxSlider.value;
      document.getElementById("buildValue").innerText = buildSlider.value;
    });

    async function generateStory() {

      const apiKey = document.getElementById("apiKey").value;
      const character = document.getElementById("character").value;
      const world = document.getElementById("world").value;
      const style = document.getElementById("style").value;

      const build = buildSlider.value;
      const climax = climaxSlider.value;

      const output = document.getElementById("output");

      if (!apiKey) {
        alert("請輸入 Gemini API Key");
        return;
      }

      output.innerHTML = "生成中... AI正在燃燒Google的伺服器。";

      const prompt = `
你是一位專業小說家。

請根據以下設定生成小說：

【角色設定】
${character}

【世界觀】
${world}

【文風】
${style}

【節奏要求】
- 鋪陳比例：${build}%
- 高潮比例：${climax}%

請生成具有完整情緒描寫與場景描寫的小說。
`;

      try {

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    {
                      text: prompt
                    }
                  ]
                }
              ]
            })
          }
        );

        const data = await response.json();

        const text =
          data.candidates?.[0]?.content?.parts?.[0]?.text ||
          "生成失敗。Google可能又在抽風。";

        output.innerText = text;

      } catch (err) {

        output.innerText =
          "發生錯誤。\n\n" + err;

      }

    }

  </script>

</body>
</html>
